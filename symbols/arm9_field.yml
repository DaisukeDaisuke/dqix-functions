main:
  versions:
    - jpn
    - eur
    - usa
  address:
    jpn: 0x2000000
    eur: 0x2000000
    usa: 0x2000000
  length:
    jpn: 0xF08000
    eur: 0xF08000
    usa: 0xF08000
  description: in field memory
  functions:
    - name: getAddrCurrentFieldId
      address:
        jpn: 0x2012DAC
      description: |-
        Returns the current field id.
        
        return: field Id addr = DAT_020fb11c([DAT_02012db4] = DAT_020fb11c(CurrentField1_Id) = 0x4E21 = angel falls)
    - name: DecodeExitTargetAndDestination
      address:
        jpn: 0x0201C8EC
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name.
        Decodes common static-exit kind, typed destination, destination vectors/facing and raw metadata. String destinations are resolved by exact field code through 0x0209B6C0; failed resolution prevents the record from being appended.
        This is exit-record decoding, not proof that an exit is currently reachable or that every transition uses this path.
    - name: GetMapExitRecord
      address:
        jpn: 0x0201E2D4
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name.
        Returns an indexed runtime static-exit record from manager storage using a 0x70-byte record stride. The name does not imply general bounds safety or that all scripted transitions are represented in this table.
    - name: HandleMinimapFixedDisplayGroup
      address:
        jpn: 0x0201F4B4
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no new runtime witness.
        BMMP opcode 0x6C handler. Builds a type-1 display group from two coordinate arguments and the following map IDs, then prepends it to the minimap group list.
        Group fields include map-ID count at +0x2, u16 ID-array pointer at +0x4, fixed display X/Z at +0x8/+0xC, and next pointer at +0x10. These coordinates are display anchors, not measured actor positions.
    - name: RequestFieldMinimapResource
      address:
        jpn: 0x020207B4
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no new runtime witness.
        Requests the minimap member using the format "%s.bmmp" and the resource name at map manager +0x26, previously selected by the map DAT handler at 0x0205F370.
        The minimap resource name need not equal the current numeric map ID or field code. This annotation does not establish all generated or scripted-map loader paths.
    - name: UpdatePartyMinimapMarkers
      address:
        jpn: 0x020230A4
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no new runtime witness.
        Produces party minimap marker data under additional party/mode/map gates. Actor +0x180 mask 0x10 selects stored minimap display X/Z through 0x020552D0; when clear, the source path uses physical actor coordinates.
        A marker in fixed-display mode is not evidence of the actor's local world X/Z, facing, movement, or AT state.
    - name: BindPartyMinimapDisplayGroups
      address:
        jpn: 0x02026540
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no new runtime witness.
        Scans minimap coordinate groups against applicable party actors' map IDs obtained through 0x02037054. Type-0 groups set actor +0x180 mask 0x08 and clear mask 0x10; type-1 groups set mask 0x10 and pass their display coordinates to 0x020552C4.
        Other actor and mode gates remain relevant. Shared outside minimap imagery does not by itself identify an interior actor's physical position.
    - name: getCurrentFieldStructure
      address:
        jpn: 0x202751C
      description: |-
        Gets the structure of the field where the player is currently located.
        The current field id is stored in 0x020FB11C(CurrentField1_Id), and the function searches for the structure based on this.
        
        return: address 0x020FDAAC + 0x314 * N(0-3 or 4)
    - name: SearchCurrentFieldStructure
      address:
        jpn: 0x2028420
      description: |-
        Finds a field structure that matches the condition of the argument.
        see: getCurrentFieldStructure
        
        r0: 0x020FDAAC
        r1: field id(angel falls = 0x4E21)
        return: address 0x020FDAAC + 0x314 * N(0-3 or 4)
    - name: SetActorMinimapDisplayXZ
      address:
        jpn: 0x020552C4
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name.
        Stores minimap display X/Z in actor fields +0x19C and +0x1A0. These fields are separate from physical actor XYZ at +0x44/+0x48/+0x4C.
        Used by the fixed-display group binding path; this setter alone does not move the actor.
    - name: GetActorMinimapDisplayXZ
      address:
        jpn: 0x020552D0
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name.
        Reads stored minimap display X/Z from actor fields +0x19C and +0x1A0 for the marker producer. The values may be fixed group anchors rather than physical actor X/Z.
    - name: HandleMapMinimapResourceName
      address:
        jpn: 0x0205F370
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no new runtime witness.
        Map AMBL DAT typed-call opcode 104 handler. Reads a non-null string argument and copies it to destination context +0x1A; in the inspected map-loader chain that context is map manager +0xC, so the selected name is at manager +0x26.
        The selected name is later used by 0x020207B4 to request a BMMP minimap resource.
    - name: SelectFieldEncounterTableByNodeAreaAndTime
      address:
        jpn: 0x02075050
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name.
        Selects a natural encounter context using the candidate node area byte and field time. An area mask of zero is a wildcard; when no area row matches, selection falls back to the time-eligible rows.
        With a nonempty eligible set, the table-selection path uses one AT integer-range draw even for a single table; an empty eligible set returns zero without that draw. Delay handling and weighted species selection are subsequent stages; this context selection alone does not certify a spawn or visible birth.
    - name: getSpawningMonsters
      address:
        jpn: 0x2075168
      description: |-
        Lottery for monsters to spawn in the field
        This table is not affected by grotto's special floor
        If this function returns a number that does not exist in the table, no spawning will occur and it will be ignored
        LR: 0x02074E20
        
        r0: BaseAddr, 0x020FDB08
        return: monsterId、Ignored if invalid
    - name: ChooseFieldMonsterId
      address:
        jpn: 0x2075168
        eur: 0x2073FEC
        usa: 0x2073FDC
      description: |-
        Choose which monsters to spawn using AT, using the monster table and probabilities deployed at specific locations in memory.
        This function only chooses the type of spawning monsters. the conditions under which the monsters are generated are selected by an unknown function.
        If an ID that cannot be spawned is returned (id not on the table, trap monster, etc.), the spawn will not be performed.
        
        arguments are not yet understood
        r1: jpn(0x20FDB08?), eur(0x20FDDC4)
        return: monsterId,

        JP source clarification (2026-10-01): rows are four bytes each. The first u16 supplies species = word & 0x0FFF and weight = (word & 0x7FFF) >> 12. The selector sums these weights, calls the AT integer-range wrapper, and returns the first species whose cumulative weight is strictly greater than the selected integer; no matching row returns 0xFFFFFFFF.
        This clarifies the JP table selector only. It does not certify a visible birth, actor association, or current AT value; existing names and region addresses are retained.
    - name: GenerateCompanionByBT
      address:
        jpn: 0x209CD4C
        eur: 0x209AFE4
        usa: 0x209AFD4
      description: |-
        Generate the number of monsters, 2nd group, and 3rd group using BT.
        
        r0: jpn(0x20FDBCC), eur(0x20FDE68) table base address
        r1: 1 Group monsterId
        r2: Table ID used to determine the type of companion?
        r3: Table ID used for companion determination and 1G number determination?
        arg5: jpn(0x27E345C), eur(0x27E333C) the resulting structure
        arg6: jpn(0x20FDAAC), eur(0x20FDD44) field information. Used to get the upper limit of monsters.
    - name: GenerateCompanionByAT
      address:
        jpn: 0x209D1C0
        eur: 0x209B458
        usa: 0x209B448
      description: |-
        Use AT to generate complete maritime encounters. Generates from the 1st group to the 3rd group.
        There is a sea area, and the range of the sea area is listed in the Japanese DQ9 strategy book etc.
        The number of groups increases every 33.3333%
        
        Consume AT random number
        Consumes BT random number
        
        r0: jpn(0x20FDBCC) table base address
        r1: table Id 114-117
        r2: the resulting structure
        r3: jpn(0x20FDAAC) This is where the upper limit information is stored, the upper limit is always 5 bodies
    - name: getEncTableStartAddr
      address:
        jpn: 0x209D75C
      description: |-
        Examine the table expanded to a specific location in memory and find the actual table start point based on the id.
        
        r0: table base addr
        r1: table id
        return: table start addr
    - name: HandleFieldEncounterRow
      address:
        jpn: 0x0209D7E8
      length:
        jpn: 0xA4
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; this callback was not freshly invoked in a runtime capture.
        Handles an encfld row while the parser manager is enabled. Decodes the packed row halfword and its integer or float scale argument, converts the scale, defaults a zero converted scale halfword to 0x1000, and passes the pair to 0x0209DBBC for the selected table.
        This is table construction, not a visible-spawn or birth observation.
    - name: HandleFieldEncounterTableDefinition
      address:
        jpn: 0x0209D894
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no fresh runtime invocation witness.
        When parser manager +0x14 is nonzero, decodes the table ID, calls the table lookup/ensure routine at 0x0209DAB8, and stores that ID at manager +0x18 for subsequent rows.
        The entry was checked with a transient read-only function definition. Its full persisted function size is not established here.
    - name: AppendFieldEncounterRow
      address:
        jpn: 0x0209DBBC
      length:
        jpn: 0x40
      description: |-
        JP source-derived annotation (2026-10-01), not an original symbol name; no fresh runtime invocation witness.
        Looks up the requested encounter table through 0x0209DB0C and returns without appending if it is absent. Otherwise increments the u16 row count at table +0x2 and appends the two supplied halfwords at table +0x8 plus four times the previous row count.
        The inspected row callback supplies the packed species/weight halfword followed by the converted scale halfword.
    - name: DAT_022A7100
      address:
        jpn: 0x218C1D0
      description: |-
        Return 0x022A7100.
        Used in processing encounters.
        It is probably the starting address of the monster structure.
        
        No arguments
        return: 0x022A7100
    - name: PreemptiveLottery
      address:
        jpn: 0x2197C50
      description: |-
        A random number is used to choose whether the enemy is first, the party is first, or a normal encounter.
        The process involves obtaining the highest dexterity value in the party and calculating the following formula
        kiyousa * 0.05 + 2
        And add an additional +10% chance if the player bumps into the monster's back.
        Then, if the monster hits the player from behind, the enemy's first strike rate is determined at 12%, and the normal encounters at 2%.
        
        arguments are not yet understood
        return: 0 for normal encounters, 1 for enemies too stunned to move, and 2 for monsters to attack you out of the blue.
    - name: getMonsterStructure
      address:
        jpn: 0x21A321C
      description: |-
        maybe get the structure of the specified monster
        Get 0x020F33D8 and search based on this
        
        for i=0; i <= 0x2f?; i++ then
          addr = (int) [0x020F33D8 + (i + 0x70) * 4 + 8] = 0x22F0E58
          if addr == 0 then
            continue
          end
          val = (short) [0x22F0E58 + 0x16a] = [0x22f0fc2] = 0x4
          if val == param_2 then
            ret addr
          end
        end
        
        structure monster{
          short   [0x2]   monsterId
          int     [0x8]   unknown int
          int     [0x38]  monster freeze tick(animation stop)
          float2  [0x40]  monster transparency
          float2  [0x44]  monster x
          short   [0x46]  monster chunk x
          float2  [0x4c]  monster z
          short   [0x4E]  monster chunk z
          float2  [0x50]  monster rotation z
          float2  [0x54]  monster rotation diff y1
          float2  [0x56]  monster rotation diff y2
          float2  [0x58]  monster rotation x
          float2  [0xC4]  Animation growing from the ground y
          ?       [0x5C]  monster size x
          ?       [0x5E]  monster size y
          ?       [0x60]  monster size z
          float2? [0xAE]  monster rotation y
          float2? [0x124] monster y+ offset
          short   [0x126] monster chunk y+ offset
          
          short   [0x168] spawned encounter table
          int     [0x16a] encounter id addr
          
        }
        
        r0: maybe the starting address of the monster 0x22A7100(check if it's 0)
        r1: Monster encountered 0-2f?
        return: 0x022A7100
    - name: RequestFieldTextureArchive
      address:
        jpn: 0x02013E08
      description: |-
        JP descriptive annotation, not an original symbol name.
        Source-derived from original JP ROM. Selects AMBL request path using native six-byte field code or generated-map variant. Does not prove current loader completion.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: PollAndLoadFieldTextureArchive
      address:
        jpn: 0x02013ED4
      description: |-
        JP descriptive annotation, not an original symbol name.
        Committee A source-derived loader. Iterates AMBL members and dispatches texture, BMBL and associated resource records. Active resource lifetime remains caller-dependent.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: RequestFieldGeometryArchive
      address:
        jpn: 0x02014374
      description: |-
        JP descriptive annotation, not an original symbol name.
        Source-derived AMDJ request. Ordinary maps use native field code; map IDs 10000/10100 use b then a phases. Generated maps require current variant. Original-State request-code 340 bytes match ROM; computed path D04M02.amdj is not a captured map-entry invocation.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: PollAndLoadFieldPlacementStreams
      address:
        jpn: 0x020144C8
      description: |-
        JP descriptive annotation, not an original symbol name.
        Committee A source-derived AMDJ loader. Matches BMDJ members against registered BMBL chunk names using case-sensitive substring helper 02004158. Do not infer BMDJ name from maplist modelResource.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: HandleBmblChunkDefinition
      address:
        jpn: 0x0201C550
      description: |-
        JP descriptive annotation, not an original symbol name.
        BMBL opcode 0x65: reads ID, XYZ and up to three names, then appends an 0x58-byte chunk record. Defined fields match one original-State record. Uninitialized string padding and runtime tail are not inferred.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: GetBmblChunkRecord
      address:
        jpn: 0x0201E064
      description: |-
        JP descriptive annotation, not an original symbol name.
        Source-derived indexed record lookup; stride 0x58, index must be nonnegative and below count. Not a map-ID lookup.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: AppendBmblChunkRecord
      address:
        jpn: 0x0201E090
      description: |-
        JP descriptive annotation, not an original symbol name.
        Source-derived append subject to count/capacity. Copies ID/XYZ and three 16-byte name fields plus remaining tail. Some caller stack bytes are uninitialized; do not model them as zero.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: ApplyFieldCameraProjectionAndView
      address:
        jpn: 0x0202DC14
      description: |-
        JP descriptive annotation, not an original symbol name.
        Committee C r6 identifies native camera projection/view submission. Bounded ordinary-state perspective packet replay matched; scripts, interpolation, shake and mode overrides remain separate.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: BuildOrdinaryFieldCameraEye
      address:
        jpn: 0x0202E148
      description: |-
        JP descriptive annotation, not an original symbol name.
        Committee C native/source evidence: target plus Y-rotated [0,height,sqrt(radius^2-height^2)] using SDK fixed-point arithmetic. Nonzero yaw R/L cases were separately reported. Not arbitrary camera-mode acceptance.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: ForwardFieldOrbitToEyeBuilder
      address:
        jpn: 0x0202E7CC
      description: |-
        JP descriptive annotation, not an original symbol name.
        Reads camera orbit height/radius at +0x74/+0x78 and forwards current yaw/target to 0202E148. Initial map preset is not necessarily the current applied camera.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: OverlapCol2CandidateAabb
      address:
        jpn: 0x02030BD4
      description: |-
        JP descriptive annotation, not an original symbol name.
        Source-derived inclusive XYZ interval overlap predicate used by COL2 candidate collector. Does not identify walkable ground by itself.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: SelectNativeFloorCandidate
      address:
        jpn: 0x02030DF4
      description: |-
        JP descriptive annotation, not an original symbol name.
        One original-State ordered-candidate selector replay matched selected index 0 and point [0,653,65536]. Barycentric ranking Y=656 differs from final fixed-point plane-intersection Y=653. No general stacked-floor acceptance.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: IntersectNativeSegmentTriangle
      address:
        jpn: 0x020316BC
      description: |-
        JP descriptive annotation, not an original symbol name.
        One naturally reached original-State segment-triangle call and outputs matched an integer replay. Input bounds and unsupported geometric branches remain explicit.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: IntersectNativePlaneSegment
      address:
        jpn: 0x02031BC8
      description: |-
        JP descriptive annotation, not an original symbol name.
        One naturally reached original-State plane-segment call matched fixed-point fraction and point [0,653,65536]. Do not substitute floating or barycentric ranking height.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: InitializeCol2ResourceHeader
      address:
        jpn: 0x0204CD64
      description: |-
        JP descriptive annotation, not an original symbol name.
        Source-derived version-3 COL2 resource header setup. Structural corpus decoding is not collision or rendering coverage.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: CollectCol2CandidateTriangles
      address:
        jpn: 0x0204CE50
      description: |-
        JP descriptive annotation, not an original symbol name.
        Native-context collector replay matched one original-State candidate: record485, attributes and order. 192-visited continuation, other instances/transforms and general-map ground remain unresolved.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: ApplyInitialFieldCameraPreset
      address:
        jpn: 0x020A4490
      description: |-
        JP descriptive annotation, not an original symbol name.
        Committee C source-derived default camera apply: controller+0x246 yaw to +0x220, height/radius to +0x224/+0x228, then native camera setter path. Initialization arrival was not dynamically witnessed in that audit.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: HandleSdkFullBillboard
      address:
        jpn: 0x020B6BB8
      description: |-
        JP descriptive annotation, not an original symbol name.
        Committee A/default SDK source path. Requires actual model-view, flags and callbacks. Original shrine two-frame probes did not reach it; no blanket native acceptance.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: HandleSdkYBillboard
      address:
        jpn: 0x020B6EC0
      description: |-
        JP descriptive annotation, not an original symbol name.
        Native outdoor entry was reached after natural movement to map7400. The observed map-specific callback sets skip bit0x40, suppressing this handler default body. Default-body packet reproduction must not substitute for that callback.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: ApplyMapBillboardCallback
      address:
        jpn: 0x020E48F4
      description: |-
        JP descriptive annotation, not an original symbol name.
        Native outdoor mode0 callback: projection-identity model-view readback, preserved 72-byte GX template, translation update, conditional cached Y-column normalization, context skip bit0x40. Initial dirty1 and following two dirty0 packets match replay. Code640 bytes match ROM. Mode1/resource correction and full-scene integration remain unresolved.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
    - name: MapYBillboardCallbackVeneer
      address:
        jpn: 0x020E4B60
      description: |-
        JP descriptive annotation, not an original symbol name.
        Native callback veneer passes mode0, render context, and map-specific packet template to 020E48F4. Observed at map7400 after original-State natural-input route; not an original symbol name.
        Evidence and limits: docs/jpn-map-render-committee-20261003.md.
  data:
    - name: CurrentField1_Id
      address:
        jpn: 0x20FB11C
      length:
        jpn: 0x2
    - name: FieldStructure1_id
      address:
        jpn: 0x20FDAAC
      length:
        jpn: 0x2
    - name: UnknownEncounterRelated1
      address:
        jpn: 0x22A4B08
      length:
        jpn: 0x4

