        Calls CheckStoryFlags(r0, r1, r2). On a match it clears work area +0x30, then passes candidate +0x0C through FUN_0206581C/FUN_02062EEC to materialize action nodes. A successful empty action list is possible, so return 1 does not guarantee that +0x30 is nonzero.
