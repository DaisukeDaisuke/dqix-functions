    - name: getNormalAttackBaseDamage
      address:
        jpn: 0x207564C
      description: |-
        Computes the binary32 normal-attack base damage before the caller's FloatToInt1 conversion.
        Every division, subtraction, random range, and addition below is a separate binary32 helper operation.

        center = (attack - defense / 2) / 2
        threshold = attack / 16
        if center <= 0: result = 0
        else if center > threshold:
          spread = center / 16
          result = center + getFloatRandRange(context, -spread, spread) + getFloatRandRange(context, -1, 1)
        else:
          result = getFloatRandRange(context, 0, threshold)
        return max(result, 0)

        The high branch consumes two LCG values, the low positive branch consumes one, and the non-positive branch consumes none.
        BattleEmulator mapping: BattleEmulator::FUN_0207564c is the corresponding approximation. FUN_021dbc04 is an HP/max-HP helper and is not this function.
        Evidence: listing/decompile at main 0x0207564C and constants at main 0x02075770/0x02075774; arithmetic and RNG order supported by static evidence.

        r0: attacker attack power, converted to binary32
        r1: defender defense, converted to binary32
        r2: BT or CT RNG context; when null, the ROM substitutes the global context at main 0x0207576C
        return: non-negative binary32 base damage
