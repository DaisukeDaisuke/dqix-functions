      address:
        jpn: 0x20B1484
      description: |-
        Allocates from an NNS frame heap with explicit alignment. Positive alignment advances the head watermark; negative alignment retreats the tail watermark. The returned address is not independently freeable and remains valid only until the owning frame heap is restored or reset.

        r0: frame heap handle
        r1: requested size
        r2: signed alignment
        return: allocated address or 0
