    - name: getFloatRand
      address:
        jpn: 0x20754D8
        eur: 0x207435C
        usa: 0x207434C
      description: |-
        Updates the 64-bit LCG and converts its upper 32 bits to binary32.
        The exact Japanese-ROM normalization is upper32 / 0xFFFFFFFF, so both 0.0 and 1.0 are possible.
        The binary64 denominator is assembled as low word 0xFFE00000 and high word 0x41EFFFFF, which is exactly 4294967295.0.
        Consumes one 64-bit LCG value through UpdateLCG.
        Evidence: listing at main 0x020754D8 plus constant decoding; confidence confirmed for arithmetic.
        
        r0: BT or CT address
        return: binary32 in [0.0, 1.0], both endpoints inclusive
    - name: getFloatRandRange
      address:
        jpn: 0x2075514
        eur: 0x2074398
        usa: 0x2074388
      description: |-
        Returns min + (max - min) * getFloatRand(context) using the game's binary32 helper calls.
        Subtraction, multiplication, and addition are separate binary32 operations and must be rounded after each operation.
        Both supplied endpoints are possible because getFloatRand returns the inclusive unit interval.
        Consumes one 64-bit LCG value.
        BattleEmulator mapping: lcg::floatRand is the closest existing method, but current branches divide by 4294967296.0 and evaluate the range in double. The ROM divides by 4294967295.0, converts to binary32, and evaluates the range with binary32 helpers, so the current emulator method is not bit-exact and excludes the upper endpoint.
        Evidence: listing at main 0x02075514 and getFloatRand at main 0x020754D8; confidence confirmed for arithmetic.
        
        r0: BT or CT address
        r1: Minimum IEEE 754 floating-point number
        r2: Maximum IEEE 754 floating-point number
        return: binary32 in [Minimum, Maximum], both endpoints inclusive when Minimum <= Maximum
