    - name: std_malloc
      address:
        jpn: 0x203207C
      description: |-
        Locks the allocator wrapper through word +0x00, dispatches allocation through the NNS allocator object at +0x04, and returns a four-byte-aligned raw pointer. The memory must be initialized separately.

        The allocator controls lifetime. In particular, 0x022A719C uses a field frame heap and cannot retain a scheduler context across heap restore/reset.

        0x02114ABC is not a dedicated payload/persistent heap. It is the lock-prefixed wrapper for the ARM9 root/main expandable heap used by normal game systems, including field/event work. Its allocator object stores alignment +4, so allocation uses the head-side ExpHeap search. A user runtime isolate on 2026-08-10 showed that leaving even a one-byte std_malloc allocation outstanding from this wrapper was sufficient to make normal non-cheat event triggers crash. Do not treat this wrapper as safe game-lifetime storage for injected code without further runtime proof.

        r0: lock-prefixed NNS allocator wrapper
        r1: Requested memory size
        return: allocated address or 0
    - name: alloc_from_typed_heap_tail
      address:
        jpn: 0x20320BC
      description: |-
        Tail-side allocation helper for a typed heap wrapper. This is not ABI-compatible with std_malloc's lock-prefixed allocator wrapper.

        The helper first reads word +0x00 as a pointer to a heap header, then checks that header type. EXPH dispatches to NNS_FndAllocFromExpHeapEx using the heap handle at wrapper +0x08 and signed alignment -4; FRMH dispatches to the corresponding frame-heap allocator with -4. A null +0x00 pointer or an unrecognized heap type returns 0 without attempting an allocation.

        Runtime verification on 2026-08-10 with desmume-state (11).dst showed that passing 0x02114ABC returns 0 because [0x02114ABC] = 0x02114AD0 and [0x02114AD0] = 1, which fails the EXPH/FRMH type test. That zero return is therefore not evidence of out-of-memory. Do not use this function as a drop-in tail replacement for std_malloc(0x02114ABC, size).

        Overlay 28 contains static reference callers, but overlay residency is not a precondition or evidence for the current GameMain runtime state.

        r0: typed heap wrapper expected by this helper
        r1: Requested memory size
        return: allocated address, or 0 when unavailable/type-mismatched/allocation fails
