    - name: DeferredProcessPersistentAllocator
      address:
        jpn: 0x2114ABC
      length:
        jpn: 0x14
      description: |-
        Historical payload-oriented name. This is actually the lock-prefixed wrapper for the ARM9 root/main expandable heap, not a dedicated deferred-process or payload heap.
        Word +0x00 is the lock object, +0x04 points to the expandable-heap allocator table 0x020E927C, +0x08 is heap handle 0x022A39A0, and +0x0C is alignment +4. The +4 alignment makes the normal allocator adapter search from the head side of the ExpHeap.
        Startup function 0x02012AE0 builds the backing ExpHeap from the remaining ARM9 OS arena and initializes its allocator object. Normal game code subsequently uses this same parent heap to obtain working/child-heap backing storage; it is therefore not independent of field/event memory planning.
        Earlier testing established only that moving the deferred process away from the field FRMH avoided the immediate stale-pointer overwrite. A stronger 2026-08-10 isolate, containing only std_malloc(this, 1) followed by return to the ACE caller, made normal non-cheat event triggers crash. Therefore this wrapper must not currently be considered safe for an outstanding game-lifetime payload allocation.
    - name: DeferredProcessPersistentExpHeap
      address:
        jpn: 0x22A39A0
      description: |-
        NNS expandable-heap header backing the ARM9 root/main allocator wrapper at 0x02114ABC. Historical DeferredProcessPersistentExpHeap naming should not be interpreted as ownership by the deferred-process payload.
        Runtime signature is EXPH (0x45585048); the observed managed extent begins near 0x022A39E8 and reaches 0x02385EEC. Startup 0x02012AE0 creates this heap from the remaining ARM9 OS arena. Field/event code uses allocations derived from this parent heap, including large temporary child-heap backing allocations, so persistent injected allocations can perturb normal game memory layout.
        In desmume-state (11).dst on 2026-08-10 the free list contained one observed block at 0x023B56EC with size 0x5814. Its lower adjacent used block began at 0x02385EDC with payload size 0x2F800; that payload begins at 0x02385EEC with FRMH signature, showing a large child FrameHeap immediately below the free range. The upper adjacent used block began at 0x023BAF10 with payload size 0x250E0 and extended to the observed heap end 0x023E0000. These 0x023Bxxxx addresses describe that State's runtime layout and are not fixed globals.
        A direct 0x2000-byte allocation through NNS_FndAllocFromExpHeapEx(heap, size, -4) returned 0x023B8F10 and preserved the low-address boundary next to the child FRMH. This provides a concrete mechanism by which normal +4 head-side injected allocations can interfere with later coalescing while a tail-side allocation may avoid disturbing that lower boundary; long-lived tail allocation safety through all events/endings remains runtime-unproven.
    - name: FieldFrameHeapAllocator
      address:
        jpn: 0x22A719C
      length:
        jpn: 0x14
      description: |-
        Field-owned lock-prefixed NNS frame-heap allocator wrapper. Word +0x04 points to the frame-heap allocator table 0x020E9274 and +0x0C contains alignment 4.
        Allocations are bump allocations with no individual free operation and become invalid when field allocator management restores or resets the frame heap. Do not register one of its raw pointers permanently in the OS scheduler.
