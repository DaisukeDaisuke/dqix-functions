      description: |-
        Builds the optional free-camera shot used by battle actions. Qualified identity: overlay_d_00:0216fda4.
        Full ARM body is 0x0216FDA4..0x02170128. Confirmed by live overlay 0 disassembly and two buruda-ga State hits.

        r0: camera/action context. The controlled one-member sample used 0x0238F954.
        r1: first actor index. The controlled sample used 0.
        r2: second actor index. The controlled sample used 0xC0.
        r3: force/default-camera flag. Zero in the controlled sample.
        return: void.

        State fields used by the function include byte flags/actor indices at +0x104..+0x107, the result handle at +0x258,
        the retry counter at +0x25C, a CT/camera RNG pointer at +0x21C, and an object passed to 02170E54 at +0x27C.
        Camera work is cleared at 0x02185370. The function always consumes RandInt(rng, 100) and stores it at cameraWork+0.

        Free-camera gating uses retryCounter = *(context+0x25C): values below 1 do not build a shot; value 5 builds directly;
        values 1..4 build only when RandInt(rng, 5-retryCounter) returns zero. A non-build path increments retryCounter.
        This is conditional retry scheduling, not an unconditional camera call.

        The build path resolves both actor indices through read_data_limit_e9_1, rejects null actors, derives a point from their
        position vectors, chooses one of four 12-byte candidate vectors at 0x02184370 with RandInt(rng, 4), and conditionally
        consumes one or two getFloatRand values for angle fields. Binary32 literals used by those formulas are 0.8, 0.6, -1.8,
        4096.0, pi, 0.7, and approximately 1.0995574. Successful construction resets retryCounter to zero, calls
        overlay_d_00:0217093C, and stores its return at context+0x258.

        Dynamic evidence: exact callback-time stack was synchronized at depth 11. One-member attack samples used
        overlay_d_25:021DC5D4 -> overlay_d_00:0216FDA4 with LR 0x021DC5D8. A four-member healing/AI State produced two delayed
        calls through overlay_d_25:021DC620 with actor-index pairs (1,0xC0), (0,1), and (2,0xC0); all took the non-build path and
        incremented retryCounter to 1, 2, and 3. This confirms that the arguments are generic actor indices rather than one-member-only fields.
        overlay_jp showed slot 3 = overlay 25 at the call, followed by overlay 25 unload and overlay 26 load into the same
        0x021D9300 slot. Confidence is confirmed for the function boundary, direct caller identities, entry arguments, retry gate,
        and RNG-call order; helper/field semantics remain supported.
