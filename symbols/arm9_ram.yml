        Allocates from an NNS expandable heap with explicit alignment. Positive alignment selects the head-side search and negative alignment selects the tail-side search.

        Runtime verification on 2026-08-10 with desmume-state (11).dst directly called this function with r0=0x022A39A0, r1=0x2000, r2=-4. It returned 0x023B8F10. getFreeDynamicMemoryByByte on the root wrapper changed from 0x5814 before allocation to 0x3804 after allocation, a 0x2010 decrease matching a 0x2000 payload plus the 0x10 ExpHeap block header. This confirms that direct negative-alignment allocation from the root ExpHeap is a functioning tail-side path independent of alloc_from_typed_heap_tail.

        r0: expandable heap handle
        r1: requested size
        r2: signed alignment
        return: allocated address or 0
