        Writes in this range are reflected into save data. The DQVC message, payload code, and fixed payload state share this envelope and must not overlap live instructions or each other.
        The ACE entry executes outside IRQ and may call normal functions. Large thread context/stack storage should be heap allocated rather than placed in this fixed range.
        The other safe storage option is heap allocation, but its runtime address correspondence is fragile and is not preferred for a reusable fixed-address payload.
