    - name: dispatchItemPickupTimerInitialization
      address:
        jpn: 0x208F320
      description: |-
        Dispatches pickup timer initialization using the persistent fountain-group byte at dynamicBase+0x5A7A (0x020F8E52 in the Japanese version).
        
        Algorithm:
        - Selectors 0 through 7 take the normal-save-load path and call applyItemPickupNormalLoadInitialization.
        - Selector 8 is the uninitialized sentinel and takes the separate new-character path. It calls UpdateAT, reduces the nonnegative 15-bit return value modulo 8, and calls setItemPickupFountainGroup.
        - With desmume-state (5).dst, the fountain selection uses the eighth UpdateAT consumption after the seed present at character confirmation (zero-based index 7). Seed 0x48037FE4 advances through 0x4F69CE6F after seven calls and 0xE5CCE77C after eight; return 0x65CC selects group 4.
        - The normal-load path does not call UpdateAT for the fountain group.
        - This branch and call path were matched between the main:0208F320 listing and repeated menu.dst runtime breakpoints.
        - Changing the selector byte to every value 0 through 7, with immediate write readback, produced the same normal-load transform with zero mismatches across all 100 timer words.
        - The full seed range 0x00032600 through 0x000327FF was executed through the live main:02003C30 and main:0208F350..0208F360 instructions with zero mismatches against the eight-consumption model (512/512).
        - During the character-confirmation State, overlay_jp.js reported overlay 17 loaded in slot 2 at 0x0218C1C0. Its caller at overlay_d_17:0218C940 invokes this main-memory function; the live main instruction bytes match the Ghidra listing.
        
        Parameters:
        - None observed; reads the pickup selector and timer table through the dynamic global base.
        
        Returns:
        - No meaningful return value observed.
        
        Side effects:
        - Dispatches initialization of ItemPickupGlobalTimerTable.
    - name: applyItemPickupNormalLoadInitialization
      address:
        jpn: 0x208F514
      description: |-
        Applies the normal-save-load initialization to the sparse 100-entry ItemPickupGlobalTimerTable at dynamicBase+0x5A7C.
        
        Algorithm:
        - For each timer word with bit 31 set and a nonzero availability mask in bits 17 through 24, clear low remaining bits 0 through 8 and the availability mask.
        - Store duration step bits 25 through 28 multiplied by 3 into the remaining field.
        - The exact unsigned transform is ((word & 0xFE01FE00) | ((((word >>> 25) & 0xF) * 3) & 0x1FF)).
        - Preserve words outside the condition.
        - main:0208F55C contains add r12,r12,r12,lsl #1 and main:0208F56C stores the result.
        - With menu.dst, area 1 changed from 0xA21E281E to 0xA2002803 while availability-zero area 99 remained 0xA4002238.
        - Repeated entry/return captures and selector 0 through 7 tests matched the transform for all 100 words with zero mismatches.
        
        Parameters:
        - None observed; reads and writes ItemPickupGlobalTimerTable through the dynamic global base.
        
        Returns:
        - No meaningful return value observed.
        
        Side effects:
        - Initializes eligible saved pickup timers to 3 through 36 remaining counts.
        - Clears their saved availability bits.
    - name: updateItemPickupRespawnTimers
      address:
        jpn: 0x208F588
      description: |-
        Updates one entry of the global pickup respawn timer table at dynamicBase+0x5A7C+areaIndex*4.
        It adds elapsedMilliseconds/1000.0 to the shared scheduler float at r0+4. At the 60.0-second threshold it clears the accumulator, then advances byte r0+0 through area indexes 0..99 and decrements each configured timer word low 9 bits. At zero it selects new point bits and reloads low9 from the encoded respawn count.
        The point-count RNG is for the current respawn, not the next one. It popcounts the current availability mask, calls UpdateAT, and reduces the result modulo (maximumPointCount-currentCount+1). When currentCount is zero, the result is clamped up to the encoded minimum count. A second UpdateAT result modulo maximumPointCount chooses the starting point index. The same call then sets that many empty availability bits, calls the materialization consumer, and reloads the timer.
        Dynamic okunai.dst events confirmed the dataflow. Area 61 used count result 0x23E7 % 6 = 5 and placement result 0x0558 % 5 = 3, immediately changed from count 0 to mask 0x1F/count 5, then reloaded word 0xA23E2A1E. Area 69 and 71 independently confirmed minimum-count clamping. When currentCount is nonzero, a zero-addition result is possible.
        For example, area 5 uses timer 0x020F8E68. A pickup sets low9 to 30, and the confirmed decrement write at 0x0208F91C changes 29 to 28. Area 18 reloads to 360 and was observed as 359 immediately after the next decrement.
        The pickup operation does not reset the shared scheduler accumulator or sweep index, so the first decrement after pickup can occur before a full 60 seconds.
        
        r0: pointer to the shared eight-byte timer scheduler; byte +0 is the current area sweep index and float +0x04 is accumulated elapsed seconds
    - name: materializeItemPickupChain
